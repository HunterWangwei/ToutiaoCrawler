name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Inject fallback update proxy
        shell: pwsh
        env:
          BUILTIN_UPDATE_PROXY: ${{ secrets.BUILTIN_UPDATE_PROXY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILTIN_UPDATE_PROXY)) {
            throw "Repository secret BUILTIN_UPDATE_PROXY is not configured"
          }
          $escaped = $env:BUILTIN_UPDATE_PROXY.Replace('\\', '\\\\').Replace('"', '\\"')
          @(
            '"""Generated during the release build; do not commit credentials."""'
            ''
            "BUILTIN_UPDATE_PROXY = `"$escaped`""
          ) | Set-Content -Encoding utf8 .\update_proxy_config.py

      - name: Build EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ToutiaoCrawler
          --collect-all tkinterdnd2
          --collect-data certifi
          --hidden-import socks
          --hidden-import urllib3.contrib.socks
          toutiao_ui.py

      - name: Create SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\ToutiaoCrawler.exe).Hash.ToLower()
          "$hash  ToutiaoCrawler.exe" | Set-Content -Encoding ascii .\dist\ToutiaoCrawler.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToutiaoCrawler-Windows
          path: |
            dist/ToutiaoCrawler.exe
            dist/ToutiaoCrawler.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/ToutiaoCrawler.exe
            dist/ToutiaoCrawler.exe.sha256
